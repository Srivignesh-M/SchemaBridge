server.address=127.0.0.1
server.port=8098
server.error.include-message=never
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.mvc.async.request-timeout=300000
migration.work-dir=./work
migration.max-rows=2000000
migration.max-plans=30
spring.config.import=optional:file:./catalog-local.properties
migration.catalog.url=${MIGRATION_CATALOG_URL:}
migration.catalog.username=${MIGRATION_CATALOG_USERNAME:}
migration.catalog.password=${MIGRATION_CATALOG_PASSWORD:}
migration.catalog.schema=${MIGRATION_CATALOG_SCHEMA:fg_solutions}
